<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPatientHUB - Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <!-- Hero / background area -->
    <section class="hero">
      <div class="hero-content">
        <h1>Welcome to MyPatientHUB!</h1>
        <p>We provide smart healthcare services in your hands.</p>
      </div>
    </section>

    <!-- Login card -->
    <section class="login-card" aria-labelledby="login-title">
      <h2 id="login-title">Sign in to MyPatientHUB</h2>

      <div class="social-login">
        <button class="social-button" type="button" aria-label="Sign in with Facebook">
          <span class="facebook-icon">f</span>
        </button>
        <button class="social-button" type="button" aria-label="Sign in with Google">
          <span class="google-icon">G</span>
        </button>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="sr-only" for="email">Email or Phone number</label>
          <input
            id="email"
            name="email"
            type="text"
            placeholder="Email or Phone number"
            autocomplete="username"
          >
          <small class="error-message" id="emailError"></small>
        </div>

        <div class="form-group password-group">
          <label class="sr-only" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Please enter your password"
            autocomplete="current-password"
          >
          <button class="password-toggle" id="togglePassword" type="button" aria-label="Show password">
            Show
          </button>
          <small class="error-message" id="passwordError"></small>
        </div>

        <button class="primary-button" type="submit">SIGN IN</button>

        <div class="form-options">
          <button class="forgot-password" id="forgotPassword" type="button">Forgot password?</button>
          <label class="remember-me">
            <input id="rememberMe" type="checkbox">
            <span>Remember me</span>
          </label>
        </div>

        <div class="divider" aria-hidden="true">
          <span></span>
          <strong>or</strong>
          <span></span>
        </div>

        <button class="signup-button" id="signUpButton" type="button">SIGN UP</button>
      </form>
    </section>

    <footer class="footer">
      <a href="#">Google Play Store APP</a>
      <a href="#">App Store APP</a>
      <a href="#">About MyPatientHUB</a>
      <a href="#">About Us</a>
      <a href="#">Our Blog</a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
